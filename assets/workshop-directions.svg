<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title desc">
<title id="title">성심당 본점에서 책과향기까지 도보 약도</title>
<desc id="desc">성심당 케익부띠끄와 본점이 있는 대종로480번길에서 ABC마트와 공차가 있는 골목으로 들어옵니다. 마라천하마라탕을 지나 오른쪽 골목으로 들어오면 책과향기 2층입니다. 인근 은행공영주차장 차량 출입구에 화장실이 있습니다. 제공된 안내자료를 바탕으로 그린 약도로 실제 거리와 축척은 다릅니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="m1 1 4 2-4 2" fill="none" stroke="#a15b67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="600" height="640" rx="8" fill="#f3f2ee"/>
<g font-family="sans-serif" fill="#232321">
<text x="28" y="35" font-size="12" letter-spacing="2">WALK TO BOOKS &amp; SCENTS</text>
<text x="28" y="72" font-size="26" font-weight="bold">성심당 본점에서 도보 약 1분</text>
