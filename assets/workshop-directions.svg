<text x="28" y="582" font-size="17"><tspan fill="#a15b67">━━</tspan> 공방까지 걷는 길</text>
<text x="28" y="611" font-size="13" fill="#74746e">제공된 안내자료 기준 · 거리와 건물 크기는 실제 축척과 다릅니다</text>
