<circle cx="191" cy="205" r="7" fill="white" stroke="#a15b67" stroke-width="4"/>
<path d="M270 255V285 M333 379H368" fill="none" stroke="#a15b67" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="464" y="310" width="119" height="49" rx="5" fill="#20201e"/>
<text x="523" y="341" font-size="21" fill="white" text-anchor="middle" font-weight="bold">책과향기</text>
