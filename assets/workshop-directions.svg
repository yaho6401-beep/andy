<g fill="#fff" stroke="#c9c7bf"><rect x="20" y="110" width="105" height="65" rx="5"/><rect x="140" y="110" width="102" height="65" rx="5"/><rect x="315" y="119" width="106" height="53" rx="5"/><rect x="315" y="239" width="106" height="47" rx="5"/><rect x="315" y="299" width="143" height="47" rx="5"/></g>
