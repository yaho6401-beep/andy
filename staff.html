<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>책과향기 · 대표와 매니저의 향 이야기</title><link rel="stylesheet" href="/style.css?v=community-11"><link rel="stylesheet" href="/journal.css?v=journal-31"><link rel="stylesheet" href="/admin.css?v=challenge-32"><link rel="stylesheet" href="/staff.css?v=challenge-32"><script src="/feedback-config.js?v=admin-8" defer></script><script src="/engine.js?v=copy-20" defer></script><script src="/record-ui.js?v=journal-31" defer></script><script src="/staff.js?v=challenge-32" defer></script></head><body class="admin-page"><header class="admin-heading"><div><p class="eyebrow">THE PEOPLE BEHIND YOUR SCENT</p><h1>대표와 매니저의 향 이야기</h1><p>각자의 시향 경험으로, 고객의 조합에 한 겹 더 깊은 이야기를.</p></div><a class="secondary" href="/">사이트로 돌아가기 ↗</a></header><main class="admin-main"><form id="staff-login" class="admin-login"><h2>코멘트 작성자 로그인</h2><label>작성자<select id="staff-login-slot"><option value="owner">대표</option></select></label><label>비밀번호<input type="password" id="staff-password" autocomplete="current-password" required maxlength="64"></label><p>대표는 기존 관리자 비밀번호로, 매니저는 관리자가 부여한 본인 비밀번호로 로그인해주세요.</p><button class="primary" type="submit">로그인</button><a class="text-button" href="/admin.html">매니저 계정 관리 · 관리자 전용 ↗</a></form><section id="staff-private" hidden><div class="admin-session"><strong id="staff-identity"></strong><button type="button" id="staff-logout" class="secondary">로그아웃</button></div><div class="record-card"><label>코멘트를 남길 향료<select id="staff-scent"></select></label><p class="staff-note">메인향 72개와 단일향 30개에 각각 코멘트를 남길 수 있어요. 고객에게 공개되며, 선택한 향의 조합 설명에도 활용됩니다.</p><form id="staff-comment-form" class="admin-record-form"><label>작성자<select id="staff-author"></select></label><label>자유 코멘트 · 필수<textarea id="staff-body" maxlength="500" required rows="5" placeholder="직접 시향한 느낌, 추천하는 순간, 조합 팁을 자유롭게 남겨주세요."></textarea></label><label>조합에 더할 핵심 포인트 · 선택<textarea id="staff-hint" maxlength="160" rows="2" placeholder="예: 장미에 머스크를 더하면 부드럽고 단정한 분위기를 만들기 좋아요."></textarea></label><fieldset class="staff-tags"><legend>향의 키워드 · 최대 3개</legend><div id="staff-tags"></div></fieldset><div class="journal-actions"><button class="primary" type="submit" id="staff-save">내 이름으로 코멘트 저장</button><button type="button" class="secondary" id="staff-delete">내 코멘트 삭제</button></div></form></div><section id="staff-existing"></section></section><p id="staff-status" role="status" aria-live="polite"></p></main></body></html>
